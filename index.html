<body>
    <h1>Spraywall Database</h1>
    <div class="search-container">
        <div style="position: relative;">
            <input 
                type="text" 
                id="searchBar" 
                class="search-bar" 
                placeholder="Search by hold name"
                onkeyup="filterClimbs(), filterHoldsSuggestions()"
                onfocus="filterHoldsSuggestions()"
                onblur="hideHoldsSuggestions()"
            >
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()" style="display: none;">×</button>
            <div id="holdsSuggestions" class="holds-suggestions" style="display: none;"></div>
        </div>
        <button class="add-btn" onclick="openAddModal()">+ Add New Climb</button>
    </div>
    <p id="result-tally" class="status"></p>
    <div id="climbList" class="loading">Loading climbs...</div>

    <!-- Add/Edit Modal -->
    <div id="climbModal" class="modal">
        <div class="modal-content">
            <div id="modalTitle" class="modal-header">Add New Climb</div>
            <form id="climbForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label for="climbName">Name</label>
                    <input type="text" id="climbName">
                </div>
                
                <div class="form-group">
                    <label for="climbHolds">Holds *</label>
                    <input type="text" id="climbHolds" required>
                </div>
                
                <div class="form-group">
                    <label for="climbFeet">Feet</label>
                    <input type="text" id="climbFeet">
                </div>
                
                <div class="form-group">
                    <label for="climbDate">Date</label>
                    <input type="date" id="climbDate">
                </div>
                
                <div class="form-group">
                    <label for="climbDifficulty">Difficulty</label>
                    <select id="climbDifficulty">
                        <option value="">Select difficulty...</option>
                        <option>1-4</option>
                        <option>4-7</option>
                        <option>7-9</option>
                        <option>10+</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn btn-success">Add Climb</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allClimbs = [];
        let currentView = 'climbs';
        let allSuggestions = new Set([]);

        async function loadClimbs() {
            try {
                const response = await fetch('/api/climbs');
                allClimbs = await response.json();
                
                displayClimbs(allClimbs);
                loadHoldsSuggestions();
                
            } catch (error) {
                document.getElementById('climbList').innerHTML = 
                    '<p>Error loading climbs. Make sure the server is running.</p>';
                console.error('Error:', error);
            }
        }

        function displayClimbs(climbs) {
            const listDiv = document.getElementById('climbList');
            
            if (climbs.length === 0) {
                listDiv.innerHTML = '<div class="no-results">No climbs found.</div>';
                return;
            }
            
            let html = '<ul class="climb-list">';
            
            climbs.forEach((climb, index) => {
                if (!climb.name) { climb.name = climb.holds.split(" ")[0] + " " + climb.holds.split(" ")[1]; }
                if (!climb.feet) { climb.feet = "N/A"; }
                if (!climb.date) { climb.date = "N/A"; }
                if (!climb.difficulty) { climb.difficulty = "fun"; }
                climb.holds += " ";
                var hold_links = ""
                const split_holds = climb.holds.split(" ")
                
                split_holds.forEach((hold, i) => {
                    var oawiehjfclaif = split_holds[i];
                    if (split_holds[i] != "") {
                        hold_links += `<button class="inline-button" onclick="fillSearch('${split_holds[i]}')">${split_holds[i]}</button>`;
                    }
                });
                html += `
                    <li class="climb-item" data-index="${index}" data-holds="${climb.holds.toLowerCase()}">
                        <div class="climb-details">
                            <div class="climb-name">${climb.name}</div>
                            <strong>Holds:</strong> ${hold_links}<br>
                            <strong>Feet:</strong> ${climb.feet}<br>
                            <strong>Date:</strong> ${climb.date}<br>
                            <block class="difficulty">V${climb.difficulty}</block>
                        </div>
                        <div class="climb-actions">
                            <button class="edit-btn" onclick="openEditModal(${index})">Edit</button>
                            <button class="delete-btn" onclick="deleteClimb(${index})">Delete</button>
                        </div>
                    </li>
                `;
            });
            
            html += '</ul>';
            listDiv.innerHTML = html;
        }

        function fillSearch(insert) {
            document.getElementById("searchBar").value = insert;
            filterClimbs();
        }

        function filterClimbs() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase();
            const climbItems = document.querySelectorAll('.climb-item');
            const tally = document.getElementById("result-tally");
            const clearBtn = document.getElementById('clearBtn');
            let visibleCount = 0;

            clearBtn.style.display = searchTerm ? 'flex' : 'none';

            climbItems.forEach(item => {
                const holds = item.getAttribute('data-holds');
                
                if (holds.includes(searchTerm + " ")) {
                    item.classList.remove('hidden');
                    visibleCount++;
                } else {
                    item.classList.add('hidden');
                }
                
            });

            tally.innerHTML = "";

            if (visibleCount === 0 && searchTerm !== '') {
                const listDiv = document.getElementById('climbList');
                const existingList = listDiv.querySelector('.climb-list');
                if (existingList) {
                    existingList.style.display = 'none';
                }
                
                let noResults = listDiv.querySelector('.no-results');
                if (!noResults) {
                    noResults = document.createElement('div');
                    noResults.className = 'no-results';
                    listDiv.appendChild(noResults);
                }
                noResults.textContent = `No climbs found with "${searchTerm}" holds.`;
                noResults.style.display = 'block';
            } else {
                const existingList = document.getElementById('climbList').querySelector('.climb-list');
                if (existingList) {
                    existingList.style.display = 'block';
                }
                const noResults = document.getElementById('climbList').querySelector('.no-results');
                if (noResults) {
                    noResults.style.display = 'none';
                }
            }

            if (visibleCount > 1 && searchTerm != '') {
                tally.innerHTML = visibleCount + " routes use \"" + searchTerm + "\"";
            } else if (visibleCount == 1 && searchTerm != '') {
                tally.innerHTML = visibleCount + " route uses \"" + searchTerm + "\"";
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Climb';
            document.getElementById('submitBtn').textContent = 'Add Climb';
            document.getElementById('submitBtn').className = 'btn btn-success';
            document.getElementById('editIndex').value = '-1';
            
            // Reset form and set today's date
            document.getElementById('climbForm').reset();
            document.getElementById('climbDate').valueAsDate = new Date();
            
            document.getElementById('climbModal').classList.add('show');
        }

        function openEditModal(index) {
            const climb = allClimbs[index];
            
            document.getElementById('modalTitle').textContent = 'Edit Climb';
            document.getElementById('submitBtn').textContent = 'Save Changes';
            document.getElementById('submitBtn').className = 'btn btn-primary';
            
            document.getElementById('editIndex').value = index;
            document.getElementById('climbName').value = climb.name;
            document.getElementById('climbHolds').value = climb.holds;
            document.getElementById('climbFeet').value = climb.feet;
            document.getElementById('climbDate').value = climb.date;
            document.getElementById('climbDifficulty').value = climb.difficulty;
            
            document.getElementById('climbModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('climbModal').classList.remove('show');
        }

        function clearSearch() {
            document.getElementById('searchBar').value = '';
            filterClimbs();
            document.getElementById('clearBtn').style.display = 'none';
        }

        document.getElementById('climbForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const index = parseInt(document.getElementById('editIndex').value);
            const climbData = {
                name: document.getElementById('climbName').value,
                holds: document.getElementById('climbHolds').value,
                feet: document.getElementById('climbFeet').value,
                date: document.getElementById('climbDate').value,
                difficulty: document.getElementById('climbDifficulty').value
            };
            
            try {
                let response;
                if (index === -1) {
                    // Add new climb
                    response = await fetch('/api/climbs', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(climbData)
                    });
                } else {
                    // Update existing climb
                    response = await fetch(`/api/climbs/${index}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(climbData)
                    });
                }
                
                if (response.ok) {
                    closeModal();
                    await loadClimbs();
                } else {
                    alert('Error saving climb');
                }
            } catch (error) {
                alert('Error saving climb');
                console.error('Error:', error);
            }
        });

        async function deleteClimb(index) {
            if (!confirm(`Are you sure you want to delete "${allClimbs[index].name}"?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/climbs/${index}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadClimbs();
                } else {
                    alert('Error deleting climb');
                }
            } catch (error) {
                alert('Error deleting climb');
                console.error('Error:', error);
            }
        }

        function loadHoldsSuggestions() {
            const holdsMap = {};
            
            // Gather all unique holds from the holds attribute
            allClimbs.forEach(climb => {
                // Parse the holds from data attribute or directly from climb object
                let holdsArray;
                if (typeof climb.holds === 'string') {
                    holdsArray = climb.holds.split(' ').map(h => h.trim().toLowerCase());
                } else if (Array.isArray(climb.holds)) {
                    holdsArray = climb.holds;
                } else {
                    holdsArray = [];
                }
                
                holdsArray.forEach(hold => {
                    if (hold) {
                        holdsMap[hold] = (holdsMap[hold] || 0) + 1;
                    }
                });
            });
            
            // Sort by count
            const sortedHolds = Object.entries(holdsMap).sort((a, b) => b[1] - a[1]);
            

            let html = '';
            sortedHolds.forEach(([hold, count]) => {
                allSuggestions.add('hold-suggestion-' + hold);
                html += `
                    <div class="hold-suggestion" id="${('hold-suggestion-' + hold)}" onmousedown="selectHold('${hold}')">
                        <span class="suggestion-name">${hold}</span>
                        <span class="suggestion-count">${count} climb${count > 1 ? 's' : ''}</span>
                    </div>
                `;
            });

            document.getElementById('holdsSuggestions').innerHTML = html;
        }

        // filter list of suggestion divs based on search input
        function filterHoldsSuggestions() {
            const searchValue = document.getElementById("searchBar").value.toLowerCase();
            allSuggestions.forEach(function(item) {
                if (item.includes('hold-suggestion-' + searchValue)) {
                    document.getElementById(item).style.display = 'block';
                } else {
                    document.getElementById(item).style.display = 'none';
                }
            });

            document.getElementById('holdsSuggestions').style.display = 'block';
        }

        function hideHoldsSuggestions() {
            setTimeout(() => {
                document.getElementById('holdsSuggestions').style.display = 'none';
            }, 200); // Delay to allow click to register
        }

        function selectHold(hold) {
            document.getElementById('searchBar').value = hold;
            filterClimbs();
            document.getElementById('holdsSuggestions').style.display = 'none';
        }

        // Close modal when clicking outside
        document.getElementById('climbModal').addEventListener('click', (e) => {
            if (e.target.id === 'climbModal') {
                closeModal();
            }
        });

        loadClimbs();
    </script>
</body>
</html>
