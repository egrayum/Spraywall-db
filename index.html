<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://kit.fontawesome.com/ff7f5f38b9.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Climbing Log</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>Spraywall Database</h1>
    <div class="search-container">
        <div style="position: relative; width: 100%; display: inline-block;">
            <i id="searchIcon" class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 14px; pointer-events: none;"></i>
            <input 
                type="text" 
                id="searchBar" 
                class="search-bar" 
                autocomplete="off"
                onkeyup="filterClimbs(), filterHoldsSuggestions()"
                onfocus="filterHoldsSuggestions(), showHoldsSuggestions()"
                onblur="hideHoldsSuggestions()"
            >
            <button class="add-btn" onclick="openAddModal()">+</button>
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()" style="display: none;">×</button>
            <div id="holdsSuggestions" class="holds-suggestions" style="display: none;"></div>
        </div>
    </div>
    <p id="result-tally" class="status"></p>
    <div id="climbList" class="loading">Loading climbs...</div>

    <!-- Add/Edit Modal -->
    <div id="climbModal" class="modal">
        <div class="modal-content">
            <div id="modalTitle" class="modal-header">Add New Climb</div>
            <form id="climbForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label for="climbName">Name</label>
                    <input type="text" id="climbName">
                </div>
                
                <div class="form-group">
                    <label for="climbHolds">Holds *</label>
                    
                    <div class="holds-input-container">
                        <div class="selected-holds" id="selectedHolds"></div>
                        <input 
                            type="text" 
                            id="climbHolds" 
                            class="holds-input"
                            placeholder="Type hold name and press Enter..."
                            autocomplete="off"
                            onkeypress="handleHoldsInput(event)"
                            onfocus="showHoldsPicker()"
                            onblur="hideHoldsPicker()"
                            oninput="filterModalHoldsSuggestions()"
                        >
                    </div>
                    
                    <div id="holdsGrid" class="holds-grid"></div>
                </div>
                
                <div class="form-group">
                    <label for="climbFeet">Feet</label>
                    <input type="text" id="climbFeet">
                </div>
                
                <div class="form-group">
                    <label for="climbDate">Date</label>
                    <input type="date" id="climbDate">
                </div>
                
                <div class="form-group">
                    <label for="climbDifficulty">Difficulty</label>
                    <select id="climbDifficulty">
                        <option value="">Select difficulty...</option>
                        <option>1-4</option>
                        <option>4-7</option>
                        <option>7-9</option>
                        <option>10+</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn btn-success">Add Climb</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
