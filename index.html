<body>
    <h1>Spraywall Database</h1>
    <div class="search-container">
        <div style="position: relative; width: 100%; display: inline-block;">
            <i id="searchIcon" class="fa-solid fa-magnifying-glass" style="position: absolute; left: 12px; top: 14px; pointer-events: none;"></i>
            <input 
                type="text" 
                id="searchBar" 
                class="search-bar" 
                autocomplete="off"
                onkeyup="filterClimbs(), filterHoldsSuggestions()"
                onfocus="filterHoldsSuggestions(), showHoldsSuggestions()"
                onblur="hideHoldsSuggestions()"
            >
            <button class="add-btn" onclick="openAddModal()">+</button>
            <button id="clearBtn" class="clear-btn" onclick="clearSearch()" style="display: none;">×</button>
            <div id="holdsSuggestions" class="holds-suggestions" style="display: none;"></div>
        </div>
        <!--<div style="text-align: right; width: 49%; display: inline-block; vertical-align: top;">
            
        </div>-->
    </div>
    <p id="result-tally" class="status"></p>
    <div id="climbList" class="loading">Loading climbs...</div>

    <!-- Add/Edit Modal -->
    <div id="climbModal" class="modal">
        <div class="modal-content">
            <div id="modalTitle" class="modal-header">Add New Climb</div>
            <form id="climbForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label for="climbName">Name</label>
                    <input type="text" id="climbName">
                </div>
                
                <div class="form-group">
                    <label for="climbHolds">Holds *</label>
                    
                    <div class="holds-input-container">
                        <div class="selected-holds" id="selectedHolds"></div>
                        <input 
                            type="text" 
                            id="climbHolds" 
                            class="holds-input"
                            placeholder="Type hold name and press Enter..."
                            autocomplete="off"
                            onkeypress="handleHoldsInput(event)"
                            onfocus="showHoldsPicker()"
                            onblur="hideHoldsPicker()"
                            oninput="filterModalHoldsSuggestions()"
                        >
                    </div>
                    
                    <div id="holdsGrid" class="holds-grid"></div>
                </div>
                
                <div class="form-group">
                    <label for="climbFeet">Feet</label>
                    <input type="text" id="climbFeet">
                </div>
                
                <div class="form-group">
                    <label for="climbDate">Date</label>
                    <input type="date" id="climbDate">
                </div>
                
                <div class="form-group">
                    <label for="climbDifficulty">Difficulty</label>
                    <select id="climbDifficulty">
                        <option value="">Select difficulty...</option>
                        <option>1-4</option>
                        <option>4-7</option>
                        <option>7-9</option>
                        <option>10+</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn btn-success">Add Climb</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allClimbs = [];
        let currentView = 'climbs';
        let allSuggestions = new Set([]);
        let selectedHolds = [];

        async function loadClimbs() {
            try {
                const response = await fetch('/api/climbs');
                allClimbs = await response.json();
                
                displayClimbs(allClimbs);
                //loadHoldsSuggestions();
                
            } catch (error) {
                document.getElementById('climbList').innerHTML = 
                    '<p>Error loading climbs. Make sure the server is running.</p>';
                console.error('Error:', error);
            }
        }

        function displayClimbs(climbs) {
            const listDiv = document.getElementById('climbList');
            if (climbs.length === 0) {
                listDiv.innerHTML = '<div class="no-results">No climbs found.</div>';
                return;
            }
            let html = '<ul class="climb-list">';
            climbs.forEach((climb, index) => {
                // Parse holds - handle both array and comma-separated string
                let holdsArray;
                if (Array.isArray(climb.holds)) {
                    holdsArray = climb.holds;
                } else if (typeof climb.holds === 'string') {
                    holdsArray = climb.holds.split(',').map(h => h.trim());
                } else {
                    holdsArray = [];
                }
                
                const holdsDisplay = holdsArray.map(h => `<span class="hold-tag">${h}</span>`).join('');
                
                html += `
                    <li class="climb-item" data-index="${index}" data-holds='${JSON.stringify(holdsArray).toLowerCase()}'>
                        <div class="climb-details">
                            <div class="climb-name">${climb.name}</div>
                            <strong>Holds:</strong> <div class="hold-tags">${holdsDisplay}</div>
                            <strong>Feet:</strong> ${climb.feet}<br>
                            <block class="difficulty">V${climb.difficulty}</block>
                        </div>
                        <div class="climb-actions">
                            <button class="edit-btn" onclick="openEditModal(${index})">Edit</button>
                            <button class="delete-btn" onclick="deleteClimb(${index})">Delete</button>
                        </div>
                    </li>
                `;
            });
            html += '</ul>';
            listDiv.innerHTML = html;
        }

        function showHoldsSuggestions() {
            loadHoldsSuggestions();
            //document.getElementById('holdsSuggestions').style.display = 'block';
            //document.getElementById('searchIcon').style.display = 'none';
            //document.getElementById('searchIcon').style.opacity = '0';
        }

        function filterClimbs() {
            const searchTerm = document.getElementById('searchBar').value.toLowerCase().trim();
            const climbItems = document.querySelectorAll('.climb-item');
            let visibleCount = 0;

            climbItems.forEach(item => {
                const holdsData = item.getAttribute('data-holds');
                let holdsArray = [];
                
                try {
                    holdsArray = JSON.parse(holdsData);
                } catch (e) {
                    console.error('Failed to parse holds:', holdsData);
                    return;
                }
                
                // Check if any hold includes the search term
                const matches = searchTerm === '' || holdsArray.some(hold => hold.toLowerCase().includes(searchTerm));
                
                if (matches) {
                    item.classList.remove('hidden');
                    visibleCount++;
                } else {
                    item.classList.add('hidden');
                }
            });

            // Show/hide no results message
            const noResultsDiv = document.getElementById('climbList').querySelector('.no-results');
            if (visibleCount === 0 && searchTerm !== '') {
                const listDiv = document.getElementById('climbList');
                const existingList = listDiv.querySelector('.climb-list');
                if (existingList) {
                    existingList.style.display = 'none';
                }
                if (!noResultsDiv) {
                    const noResults = document.createElement('div');
                    noResults.className = 'no-results';
                    noResults.textContent = `No climbs found with "${searchTerm}" holds.`;
                    listDiv.appendChild(noResults);
                } else {
                    noResultsDiv.textContent = `No climbs found with "${searchTerm}" holds.`;
                    noResultsDiv.style.display = 'block';
                }
            } else {
                const existingList = document.getElementById('climbList').querySelector('.climb-list');
                if (existingList) {
                    existingList.style.display = 'block';
                }
                if (noResultsDiv) {
                    noResultsDiv.style.display = 'none';
                }
            }
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Climb';
            document.getElementById('submitBtn').textContent = 'Add Climb';
            document.getElementById('submitBtn').className = 'btn btn-success';
            document.getElementById('editIndex').value = '-1';
            
            document.getElementById('climbForm').reset();
            document.getElementById('climbDate').valueAsDate = new Date();
            
            selectedHolds = []; // Clear selection
            updateSelectedDisplay();
            showHoldsPicker(); // Show the holds picker
            
            document.getElementById('climbModal').classList.add('show');
        }

        function openEditModal(index) {
            const climb = allClimbs[index];
            
            document.getElementById('modalTitle').textContent = 'Edit Climb';
            document.getElementById('submitBtn').textContent = 'Save Changes';
            document.getElementById('submitBtn').className = 'btn btn-primary';
            
            document.getElementById('editIndex').value = index;
            document.getElementById('climbName').value = climb.name;
            document.getElementById('climbFeet').value = climb.feet;
            document.getElementById('climbDate').value = climb.date;
            document.getElementById('climbDifficulty').value = climb.difficulty;
            
            // Load existing holds into selectedHolds
            selectedHolds = Array.isArray(climb.holds) ? [...climb.holds] : (typeof climb.holds === 'string' ? climb.holds.split(',').map(h => h.trim()) : []);
            updateSelectedDisplay();
            showHoldsPicker(); // Show the holds picker
            
            document.getElementById('climbModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('climbModal').classList.remove('show');
        }

        function clearSearch() {
            document.getElementById('searchBar').value = '';
            filterClimbs();
            document.getElementById('clearBtn').style.display = 'none';
        }

        function handleHoldsInput(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const input = document.getElementById('climbHolds');
                const newHold = input.value.trim().toLowerCase();
                
                if (newHold && !selectedHolds.includes(newHold)) {
                    selectedHolds.push(newHold);
                    updateSelectedDisplay();
                    showHoldsPicker();
                }
                
                input.value = '';
            }
        }

        function hideHoldsPicker() {
            setTimeout(() => {
                document.getElementById('holdsGrid').style.display = 'none';
            }, 200);
        }

        document.getElementById('climbForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const index = parseInt(document.getElementById('editIndex').value);
            const climbData = {
                name: document.getElementById('climbName').value,
                holds: selectedHolds.join(' '), // Use selectedHolds array
                feet: document.getElementById('climbFeet').value,
                date: document.getElementById('climbDate').value,
                difficulty: parseInt(document.getElementById('climbDifficulty').value)
            };
            
            try {
                let response;
                if (index === -1) {
                    response = await fetch('/api/climbs', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(climbData)
                    });
                } else {
                    response = await fetch(`/api/climbs/${index}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(climbData)
                    });
                }
                
                if (response.ok) {
                    closeModal();
                    await loadClimbs();
                } else {
                    alert('Error saving climb');
                }
            } catch (error) {
                alert('Error saving climb');
                console.error('Error:', error);
            }
        });

        let allHoldsMap = {}; // Cache all holds

        function buildHoldsMap() {
            allHoldsMap = {};
            
            allClimbs.forEach(climb => {
                let holdsArray;
                if (typeof climb.holds === 'string') {
                    holdsArray = climb.holds.split(' ').map(h => h.trim().toLowerCase());
                } else if (Array.isArray(climb.holds)) {
                    holdsArray = climb.holds;
                } else {
                    holdsArray = [];
                }
                
                holdsArray.forEach(hold => {
                    if (hold) {
                        allHoldsMap[hold] = (allHoldsMap[hold] || 0) + 1;
                    }
                });
            });
        }

        function showHoldsPicker() {
            buildHoldsMap();
            const sortedHolds = Object.entries(allHoldsMap).sort((a, b) => b[1] - a[1]);
            
            let html = '';
            sortedHolds.forEach(([hold, count]) => {
                const isSelected = selectedHolds.includes(hold);
                html += `
                    <div class="hold-chip ${isSelected ? 'selected' : ''}" onclick="toggleHold('${hold}')">
                        ${hold} <span class="hold-count">(${count})</span>
                    </div>
                `;
            });
            
            document.getElementById('holdsGrid').innerHTML = html;
            document.getElementById('holdsGrid').style.display = 'flex';
        }

        function addNewHold() {
            const input = document.getElementById('newHoldInput');
            const newHold = input.value.trim().toLowerCase();
            
            if (!newHold) {
                alert('Please enter a hold type');
                return;
            }
            
            if (selectedHolds.includes(newHold)) {
                alert('This hold is already selected');
                return;
            }
            
            // Add to selected holds
            selectedHolds.push(newHold);
            updateSelectedDisplay();
            showHoldsPicker();
            
            // Clear input
            input.value = '';
            input.focus();
        }

        // Allow Enter key to add hold
        document.addEventListener('DOMContentLoaded', function() {
            const newHoldInput = document.getElementById('newHoldInput');
            if (newHoldInput) {
                newHoldInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        addNewHold();
                    }
                });
            }
        });

        function toggleHold(hold) {
            const index = selectedHolds.indexOf(hold);
            if (index > -1) {
                selectedHolds.splice(index, 1);
            } else {
                selectedHolds.push(hold);
            }
            updateSelectedDisplay();
            showHoldsPicker(); // Refresh grid
        }

        function updateSelectedDisplay() {
            const container = document.getElementById('selectedHolds');
            if (selectedHolds.length === 0) {
                container.innerHTML = '<span class="placeholder">No holds selected</span>';
                return;
            }
            
            let html = '';
            selectedHolds.forEach(hold => {
                html += `
                    <span class="selected-tag">
                        ${hold}
                        <span class="remove-tag" onclick="toggleHold('${hold}')">×</span>
                    </span>
                `;
            });
            container.innerHTML = html;
        }

        async function deleteClimb(index) {
            if (!confirm(`Are you sure you want to delete "${allClimbs[index].name}"?`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/climbs/${index}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    await loadClimbs();
                } else {
                    alert('Error deleting climb');
                }
            } catch (error) {
                alert('Error deleting climb');
                console.error('Error:', error);
            }
        }

        function loadHoldsSuggestions() {
            const holdsMap = {};
            
            // Gather all unique holds from the holds attribute
            allClimbs.forEach(climb => {
                // Parse the holds from data attribute or directly from climb object
                let holdsArray;
                if (typeof climb.holds === 'string') {
                    holdsArray = climb.holds.split(' ').map(h => h.trim().toLowerCase());
                } else if (Array.isArray(climb.holds)) {
                    holdsArray = climb.holds;
                } else {
                    holdsArray = [];
                }
                
                holdsArray.forEach(hold => {
                    if (hold) {
                        holdsMap[hold] = (holdsMap[hold] || 0) + 1;
                    }
                });
            });
            
            // Sort by count
            const sortedHolds = Object.entries(holdsMap).sort((a, b) => b[1] - a[1]);

            let html = '';
            sortedHolds.forEach(([hold, count]) => {
                allSuggestions.add('hold-suggestion-' + hold);
                html += `
                    <div class="hold-suggestion" id="${('hold-suggestion-' + hold)}" onmousedown="selectHold('${hold}')">
                        <span class="suggestion-name">${hold}</span>
                        <span class="suggestion-count">${count} climb${count > 1 ? 's' : ''}</span>
                    </div>
                `;
            });

            document.getElementById('holdsSuggestions').innerHTML = html;

            html = '';
            sortedHolds.forEach(([hold, count]) => {
                html += `
                    <div class="hold-suggestion" id="${('modal-hold-suggestion-' + hold)}" onmousedown="selectModalHold('${hold}')">
                        <span class="suggestion-name">${hold}</span>
                        <span class="suggestion-count">${count} climb${count > 1 ? 's' : ''}</span>
                    </div>
                `;
            });
            document.getElementById('modalHoldsSuggestions').innerHTML = html;
        }

        // filter list of suggestion divs based on input
        function filterHoldsSuggestions() {
            const searchValue = document.getElementById("searchBar").value.toLowerCase();
            allSuggestions.forEach(function(item) {
                if (item.includes('hold-suggestion-' + searchValue)) {
                    document.getElementById(item).style.display = 'block';
                } else {
                    document.getElementById(item).style.display = 'none';
                }
            });

            document.getElementById('holdsSuggestions').style.display = 'block';
            document.getElementById('searchIcon').style.display = 'none';
        }

        function hideHoldsSuggestions() {
            setTimeout(() => {
                document.getElementById('holdsSuggestions').style.display = 'none';
                if (document.getElementById('searchBar').value === '') {
                    document.getElementById('searchIcon').style.display = 'inline-block';
                }
            }, 200); // Delay to allow click to register
        }

        function selectHold(hold) {
            document.getElementById('searchBar').value = hold;
            filterClimbs();
            document.getElementById('holdsSuggestions').style.display = 'none';
        }


        function filterModalHoldsSuggestions() {
            const input = document.getElementById('climbHolds').value.toLowerCase();
            const lastSpace = input.lastIndexOf(' ');
            const searchTerm = lastSpace >= 0 ? input.slice(lastSpace + 1).trim() : input.trim();
            
            // Filter the holdsGrid chips
            const holdChips = document.querySelectorAll('.hold-chip');
            holdChips.forEach(chip => {
                const holdName = chip.textContent.toLowerCase();
                if (holdName.includes(searchTerm) || searchTerm === '') {
                    chip.style.display = 'block';
                } else {
                    chip.style.display = 'none';
                }
            });
            
            // Show the grid when typing
            if (searchTerm !== '' || input !== '') {
                document.getElementById('holdsGrid').style.display = 'flex';
            }
        }

        function hideModalHoldsSuggestions() {
            setTimeout(() => {
                document.getElementById('modalHoldsSuggestions').style.display = 'none';
            }, 200);
        }

        function selectModalHold(hold) {
            const input = document.getElementById('climbHolds');
            const currentValue = input.value;
            const lastComma = currentValue.lastIndexOf(' ');
            
            if (lastComma >= 0) {
                // Replace the last tag after the comma
                input.value = currentValue.slice(0, lastComma + 1) + hold;
            } else {
                // Replace entire value
                input.value = hold;
            }
            
            input.focus();
            document.getElementById('modalHoldsSuggestions').style.display = 'none';
        }

        // Close modal when clicking outside
        document.getElementById('climbModal').addEventListener('click', (e) => {
            if (e.target.id === 'climbModal') {
                closeModal();
            }
        });

        loadClimbs();
    </script>
</body>
</html>
